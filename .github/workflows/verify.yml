name: Verify

on:
  workflow_call:

jobs:
  verify-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
      - name: Run tests with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic ./...
      - name: Build backend
        run: go build ./...
      - name: Race-check live work and runtime observations
        run: go test -race ./internal/desiredstate/... ./internal/operations/... ./internal/docker/... ./internal/http/... ./internal/reconcile/... ./internal/scheduler/... ./internal/refresh/...

  verify-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - name: Run tests with coverage
        run: bun run test --coverage

  verify-gitops-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DOCKER_AUTH_CONFIG: '{}'
      GIN_MODE: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
      - name: Verify Docker and Compose prerequisites
        run: docker info && docker compose version
      - name: Full real-Docker lifecycle, image identity and observation coverage
        working-directory: backend
        run: go test -race -tags integration ./tests/integration/... -count=1 -timeout=30m -v

  verify-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOCKER_AUTH_CONFIG: '{}'
      E2E_PULL_HOLD_MS: '65000'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bun install --frozen-lockfile
        working-directory: tests/e2e
      - run: bunx playwright install --with-deps chromium
        working-directory: tests/e2e
      - name: Browser GitOps lifecycle against DinD
        run: bun run test
        working-directory: tests/e2e
      - name: Frontend browser coverage
        run: bun run test:frontend
        working-directory: tests/e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gitops-playwright-results
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 7
